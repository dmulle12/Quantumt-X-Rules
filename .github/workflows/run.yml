name: Generate routing rules for Quantumult X

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"

concurrency:
  group: qx-rules-publish
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare directories
        run: mkdir -p ruleset

      - name: Generate iCloud
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/icloud.txt \
            | awk -F ':' '/^full:/ {printf "HOST,%s\n",$2} /^domain:/ {printf "HOST-SUFFIX,%s\n",$2}' \
            > ruleset/icloud.txt
          test -s ruleset/icloud.txt

      - name: Generate Google
        run: |
          curl -fsSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf \
            | perl -ne '/^server=\/([^\/]+)\// && print "HOST-SUFFIX,$1\n"' \
            > ruleset/google.txt
          test -s ruleset/google.txt

      - name: Generate Apple
        run: |
          curl -fsSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf \
            | perl -ne '/^server=\/([^\/]+)\// && print "HOST-SUFFIX,$1\n"' \
            > ruleset/apple.txt
          test -s ruleset/apple.txt

      # Converts Loyalsoldier v2ray-rules-dat lines into Quantumult X filter rules:
      #   full:example.com    -> HOST,example.com,<policy>
      #   domain:example.com  -> HOST-SUFFIX,example.com,<policy>
      #   plain-domain        -> HOST-SUFFIX,plain-domain,<policy>
      #   regexp:...          -> HOST-REGEX,...,,<policy>
      #   keyword:...         -> HOST-KEYWORD,...,,<policy>
      # Anything else is reported to the log instead of being silently dropped.

      - name: Generate Direct
        env:
          QX_POLICY: direct
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/direct-list.txt \
            | perl -ne '
                $p = $ENV{QX_POLICY};
                if    (/^full:(.+)/)   { print "HOST,$1,$p\n"; }
                elsif (/^domain:(.+)/) { print "HOST-SUFFIX,$1,$p\n"; }
                elsif (/^regexp:(.+)/) { $r = $1; $r =~ /,/ ? warn "skip comma regex: $r\n" : print "HOST-REGEX,$r,$p\n"; }
                elsif (/^keyword:(.+)/){ print "HOST-KEYWORD,$1,$p\n"; }
                elsif (/^([A-Za-z0-9_.\-]+)$/) { print "HOST-SUFFIX,$1,$p\n"; }
                else { warn "unmatched line: $_"; }
              ' \
            | sort -u > ruleset/direct.txt
          test -s ruleset/direct.txt

      - name: Generate Proxy
        env:
          QX_POLICY: proxy
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/proxy-list.txt \
            | perl -ne '
                $p = $ENV{QX_POLICY};
                if    (/^full:(.+)/)   { print "HOST,$1,$p\n"; }
                elsif (/^domain:(.+)/) { print "HOST-SUFFIX,$1,$p\n"; }
                elsif (/^regexp:(.+)/) { $r = $1; $r =~ /,/ ? warn "skip comma regex: $r\n" : print "HOST-REGEX,$r,$p\n"; }
                elsif (/^keyword:(.+)/){ print "HOST-KEYWORD,$1,$p\n"; }
                elsif (/^([A-Za-z0-9_.\-]+)$/) { print "HOST-SUFFIX,$1,$p\n"; }
                else { warn "unmatched line: $_"; }
              ' \
            | sort -u > ruleset/proxy.txt
          test -s ruleset/proxy.txt

      - name: Generate Reject
        env:
          QX_POLICY: reject
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/reject-list.txt \
            | perl -ne '
                $p = $ENV{QX_POLICY};
                if    (/^full:(.+)/)   { print "HOST,$1,$p\n"; }
                elsif (/^domain:(.+)/) { print "HOST-SUFFIX,$1,$p\n"; }
                elsif (/^regexp:(.+)/) { $r = $1; $r =~ /,/ ? warn "skip comma regex: $r\n" : print "HOST-REGEX,$r,$p\n"; }
                elsif (/^keyword:(.+)/){ print "HOST-KEYWORD,$1,$p\n"; }
                elsif (/^([A-Za-z0-9_.\-]+)$/) { print "HOST-SUFFIX,$1,$p\n"; }
                else { warn "unmatched line: $_"; }
              ' \
            | sort -u > ruleset/reject.txt
          test -s ruleset/reject.txt

      - name: Generate Private
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/private.txt \
            | awk -F ':' '
                /^full:/   {printf "HOST,%s,direct\n",$2}
                /^domain:/ {printf "HOST-SUFFIX,%s,direct\n",$2}
              ' \
            | sort -u > ruleset/private.txt
          test -s ruleset/private.txt

      - name: Generate GFW
        env:
          QX_POLICY: proxy
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/gfw.txt \
            | perl -ne '
                $p = $ENV{QX_POLICY};
                if    (/^full:(.+)/)   { print "HOST,$1,$p\n"; }
                elsif (/^domain:(.+)/) { print "HOST-SUFFIX,$1,$p\n"; }
                elsif (/^regexp:(.+)/) { $r = $1; $r =~ /,/ ? warn "skip comma regex: $r\n" : print "HOST-REGEX,$r,$p\n"; }
                elsif (/^keyword:(.+)/){ print "HOST-KEYWORD,$1,$p\n"; }
                elsif (/^([A-Za-z0-9_.\-]+)$/) { print "HOST-SUFFIX,$1,$p\n"; }
                else { warn "unmatched line: $_"; }
              ' \
            | sort -u > ruleset/gfw.txt
          test -s ruleset/gfw.txt

      - name: Generate GreatFire
        env:
          QX_POLICY: proxy
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/greatfire.txt \
            | perl -ne '
                $p = $ENV{QX_POLICY};
                if    (/^full:(.+)/)   { print "HOST,$1,$p\n"; }
                elsif (/^domain:(.+)/) { print "HOST-SUFFIX,$1,$p\n"; }
                elsif (/^regexp:(.+)/) { $r = $1; $r =~ /,/ ? warn "skip comma regex: $r\n" : print "HOST-REGEX,$r,$p\n"; }
                elsif (/^keyword:(.+)/){ print "HOST-KEYWORD,$1,$p\n"; }
                elsif (/^([A-Za-z0-9_.\-]+)$/) { print "HOST-SUFFIX,$1,$p\n"; }
                else { warn "unmatched line: $_"; }
              ' \
            | sort -u > ruleset/greatfire.txt
          test -s ruleset/greatfire.txt

      - name: Generate TLD not CN
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/tld-!cn.txt \
            | awk -F ':' '/^domain:/ {printf "HOST-SUFFIX,%s,proxy\n",$2}' \
            | sort -u > ruleset/tld-not-cn.txt
          test -s ruleset/tld-not-cn.txt

      - name: Generate China CIDR
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt -o /tmp/cn.txt
          perl -ne '/^(\d{1,3}(\.\d{1,3}){3}\/\d{1,2})/ && print "IP-CIDR,$1,direct\n"' /tmp/cn.txt > ruleset/cncidr.txt
          grep ":" /tmp/cn.txt | perl -ne '/(.+\/\d+)/ && print "IP-CIDR6,$1,direct\n"' >> ruleset/cncidr.txt
          test -s ruleset/cncidr.txt

      - name: Generate Telegram CIDR
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/telegram.txt -o /tmp/telegram.txt
          perl -ne '/^(\d{1,3}(\.\d{1,3}){3}\/\d{1,2})/ && print "IP-CIDR,$1,proxy\n"' /tmp/telegram.txt > ruleset/telegramcidr.txt
          grep ":" /tmp/telegram.txt | perl -ne '/(.+\/\d+)/ && print "IP-CIDR6,$1,proxy\n"' >> ruleset/telegramcidr.txt
          test -s ruleset/telegramcidr.txt

      - name: Clean rules
        run: |
          for file in ruleset/*.txt; do
            sed -i '/^$/d' "$file"
            sort -u "$file" -o "$file"
          done

      - name: Show generated rules
        run: |
          echo "===== Generated Quantumult X rules ====="
          for file in ruleset/*.txt; do
            echo
            echo "### $file"
            echo "Lines: $(wc -l < "$file")"
            head -n 5 "$file"
          done

      - name: Push release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p publish/ruleset
          cp ruleset/*.txt publish/ruleset/

          cd publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "Released on $(date -u +%Y%m%d%H%M)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin release

      - name: Purge jsDelivr
        run: |
          for file in ruleset/*.txt; do
            name=$(basename "$file")
            curl -fsSL "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/ruleset/$name" -o /dev/null
          done
