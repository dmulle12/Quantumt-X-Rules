name: Generate routing rules for Quantumult X

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set variables
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: Prepare directories
        run: |
          mkdir -p ruleset

      - name: Generate iCloud
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/icloud.txt \
          | awk -F ':' '/^full:/ {printf "HOST,%s\n",$2} /^domain:/ {printf "HOST-SUFFIX,%s\n",$2}' \
          > ruleset/icloud.txt

      - name: Generate Google
        run: |
          curl -sSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf \
          | perl -ne '/^server=\/([^\/]+)\// && print "HOST-SUFFIX,$1\n"' \
          > ruleset/google.txt

      - name: Generate Apple
        run: |
          curl -sSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf \
          | perl -ne '/^server=\/([^\/]+)\// && print "HOST-SUFFIX,$1\n"' \
          > ruleset/apple.txt

      - name: Generate Direct
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/direct-list.txt \
          | grep -Ev "^(regexp|keyword):" \
          | perl -ne '
            /^(full:)([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ &&
              print "HOST,$2,DIRECT\n";
            /^(domain:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ &&
              print "HOST-SUFFIX,$2,DIRECT\n";
          ' \
          | sort -u > ruleset/direct.txt

      - name: Generate Proxy
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/proxy-list.txt \
          | grep -Ev "^(regexp|keyword):" \
          | perl -ne '
            /^(full:)([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ &&
              print "HOST,$2,PROXY\n";
            /^(domain:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ &&
              print "HOST-SUFFIX,$2,PROXY\n";
          ' \
          | sort -u > ruleset/proxy.txt

      - name: Generate Reject
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/reject-list.txt \
          | grep -Ev "^(regexp|keyword):" \
          | perl -ne '
            /^(domain:|full:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ &&
              print "HOST-SUFFIX,$2,REJECT\n";
          ' \
          | sort -u > ruleset/reject.txt

      - name: Generate Private
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/private.txt \
          | awk -F ':' '
            /^full:/ {printf "HOST,%s,DIRECT\n",$2}
            /^domain:/ {printf "HOST-SUFFIX,%s,DIRECT\n",$2}
          ' \
          | sort -u > ruleset/private.txt

      - name: Generate GFW
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/gfw.txt \
          | grep -Ev "^(regexp|keyword):" \
          | perl -ne '
            /^(domain:|full:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ &&
              print "HOST-SUFFIX,$2,PROXY\n";
          ' \
          | sort -u > ruleset/gfw.txt

      - name: Generate GreatFire
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/greatfire.txt \
          | grep -Ev "^(regexp|keyword):" \
          | perl -ne '
            /^(domain:|full:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ &&
              print "HOST-SUFFIX,$2,PROXY\n";
          ' \
          | sort -u > ruleset/greatfire.txt

      - name: Generate TLD not CN
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/tld-!cn.txt \
          | awk -F ':' '/^domain:/ {printf "HOST-SUFFIX,%s,PROXY\n",$2}' \
          | sort -u > ruleset/tld-not-cn.txt

      - name: Generate China CIDR
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt \
          | perl -ne '
            /^(\d{1,3}(\.\d{1,3}){3}\/\d{1,2})/ &&
              print "IP-CIDR,$1,DIRECT\n";
          ' > ruleset/cncidr.txt

          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt \
          | grep ":" \
          | perl -ne '
            /(.+\/\d+)/ &&
              print "IP-CIDR6,$1,DIRECT\n";
          ' >> ruleset/cncidr.txt

      - name: Generate Telegram CIDR
        run: |
          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/telegram.txt \
          | perl -ne '
            /^(\d{1,3}(\.\d{1,3}){3}\/\d{1,2})/ &&
              print "IP-CIDR,$1,PROXY\n";
          ' > ruleset/telegramcidr.txt

          curl -sSL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/telegram.txt \
          | grep ":" \
          | perl -ne '
            /(.+\/\d+)/ &&
              print "IP-CIDR6,$1,PROXY\n";
          ' >> ruleset/telegramcidr.txt

      - name: Clean rules
        run: |
          for file in ruleset/*.txt; do
            sed -i '/^$/d' "$file"
            sort -u "$file" -o "$file"
          done

      - name: Show generated rules
        run: |
          echo "===== Generated Quantumult X rules ====="
          for file in ruleset/*.txt; do
            echo
            echo "### $file"
            echo "Lines: $(wc -l < "$file")"
            head -n 5 "$file"
          done

      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp -r ruleset publish/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            publish/ruleset/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release branch
        run: |
          cd publish

          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"

          git remote add origin \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

          git push -f -u origin release

      - name: Purge jsDelivr
        run: |
          for file in ruleset/*.txt; do
            name=$(basename "$file")
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/ruleset/$name"
          done
